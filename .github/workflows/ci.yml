name: CI Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  performance-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4       # Descarga tu repo
      - uses: grafana/setup-k6-action@v1 # Instala k6 en el runner

      - name: Run k6 with Grafana Cloud
        run : |
          K6_PROMETHEUS_RW_URL=${{ secrets.GRAFANA_URL }} \
          K6_PROMETHEUS_RW_USERNAME=${{ secrets.GRAFANA_USER }} \
          K6_PROMETHEUS_RW_PASSWORD=${{ secrets.GRAFANA_API_KEY }} \
          k6 run test/check.js --summary-export=summary.json

      - name: Upload summary artifact
        uses: actions/upload-artifact@v4
        with:
          name: k6-summary
          path: summary.json